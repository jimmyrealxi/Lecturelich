<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lecturelich ภาพจอเขียว</title>
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600&family=Chonburi&family=VT323&display=swap" rel="stylesheet">
<style>
/* ภาพตอบสนองปุ่มละ 3 แบบให้เลือก · วาดเองทั้งหมดด้วยโค้ด ไม่ใช้ภาพ/ตัวละครของเกมใด · ร่างให้เลือก ยังไม่ลงโค้ด */
:root{--rule2:#8C7B60;--crt:#08130C;--crtOn:#9EF0B4;--crtBig:#B8FFC9;--crtDim:#73C48B}
*{box-sizing:border-box;margin:0;padding:0}
::selection{background:var(--crtOn);color:var(--crt)}
:focus-visible{outline:2px solid var(--crtBig);outline-offset:2px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
body{background:#1C1915;color:#E9E2D2;font:15px/1.5 Anuphan,sans-serif;padding:24px 16px 40px}
.page{max-width:1040px;margin:0 auto}
h1{font:400 22px/1.4 Chonburi,serif;color:#F3EAD2}
.lead{color:#C9BFAA;font-size:14px;max-width:70ch;margin-top:4px}
.ctl{margin-top:12px}
.ctl button{min-height:44px;padding:0 14px;border:1.5px solid var(--rule2);border-radius:3px;font-size:14px;color:#E9E2D2}
.ctl button[aria-pressed=true]{background:#F3EAD2;color:#2A2118;font-weight:600}
h2{font:400 19px/28px Chonburi,serif;color:#F3EAD2;margin:26px 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.crt{position:relative;display:block;width:100%;height:190px;overflow:hidden;background:var(--crt);color:var(--crtOn);border-radius:14px}
canvas{position:absolute;left:0;top:0;width:100%;height:calc(100% - 38px);image-rendering:pixelated}
.scan,.vig{position:absolute;inset:0;pointer-events:none}
.scan{background:repeating-linear-gradient(0deg,rgba(0,0,0,.24) 0 1px,transparent 1px 3px)}
.vig{background:radial-gradient(120% 110% at 50% 50%,transparent 58%,rgba(0,0,0,.5) 100%)}
.idle{position:absolute;inset:0 0 38px;display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--crtDim)}
.playing .idle{visibility:hidden}
.say{position:absolute;left:8px;right:8px;bottom:9px;text-align:center;font:600 15px/22px Anuphan;opacity:0}
.say.on{opacity:1}
/* VT323 ไม่มีตัวไทย ใช้กับ XP เท่านั้น คำไทยใช้ Anuphan */
.say span{font:500 15px/20px Anuphan;margin-left:8px;color:var(--crtBig)}
.say span.n{font:400 19px/20px VT323,monospace}
.rnd{min-height:44px;padding:0 14px;margin-bottom:10px;border:1.5px solid var(--rule2);border-radius:3px;font-size:14px;color:#E9E2D2}
.name{margin-top:6px;font-size:14px;color:#C9BFAA}
.name b{color:#F3EAD2;font-weight:600}
</style>
</head>
<body>
<div class="page">
  <h1>ภาพจอเขียวปุ่มละ 5 แบบ แอปสุ่มให้ (ร่างให้อนุมัติ · ยังไม่ลงโค้ด)</h1>
  <p class="lead">แตะจอแต่ละใบเพื่อดูภาพ แตะอีกครั้งเพื่อข้าม ปุ่ม "สุ่ม" คือสิ่งที่แอปจะทำจริงตอนกด โดยไม่ออกแบบเดิมซ้ำติดกัน</p>
  <div class="ctl"><button id="still" aria-pressed="false">ลดการเคลื่อนไหว</button></div>
  <div id="root"></div>
</div>
<script>
// ทุกภาพวาดบนกริดพิกเซล สีเดียวแบบฟอสเฟอร์

const dust=(g,x,y,t)=>{for(let i=0;i<9;i++){const a=hash(i,7)*3.14,r=t*(8+hash(i,8)*12);if(hash(i,9)>t*.9)px(g,x+Math.cos(a)*r,y-Math.sin(a)*r*.6,DIM)}};

 {t:"มาเรียน",v:[

 {t:"ขาด",v:[

 ]},
 {t:"งดสอน",v:[
  {n:"A",d:"ปาร์ตี้ฉลอง",ms:1400,m:"อาจารย์งด เย้!",s:"ไม่นับขาด",f(g,W,H,t){ground(g,W,H);const b=Math.abs(Math.sin(t*16))*6;sp(g,Math.floor(t*12)%2?WAVE:STAND,W/2-7,H-3-MAN_H-b);for(let i=0;i<42;i++){const x=hash(i,3)*W,sp2=.5+hash(i,4),y=((t*sp2*1.6+hash(i,5))%1)*(H-4);rect(g,x,y,2,1,i%3?ON:HI)}}},
  {n:"B",d:"ไปหมูกระทะ",ms:1500,m:"ไปหมูกระทะกัน",s:"ไม่นับขาด",f(g,W,H,t){const cx=W/2,cy=H-16,r=20;disc(g,cx,cy,r,(x,y)=>{if(y<=cy&&(x-cx)**2+(y-cy)**2>=(r-2)**2)px(g,x,y,ON)});rect(g,cx-r-4,cy,2*r+8,2,ON);rect(g,cx-r+3,cy+2,2*r-6,7,DIM);frame(g,cx-r+3,cy+2,2*r-6,7,ON);for(let i=0;i<7;i++){const a=(i+.5)/7*3.14,rr=r*.55;if(hash(i,Math.floor(t*14))>.28)rect(g,cx+Math.cos(a)*rr-2,cy-Math.sin(a)*rr,4,2,HI)}for(let s=0;s<3;s++){const x0=cx-12+s*12;for(let k=0;k<16;k++){const q=k/16,y=cy-r-2-q*(H-r-14)*clamp(t/.4);if(y>0)px(g,x0+Math.sin(q*6+t*16+s)*3,y,q>.7?DIM:ON)}}}},

 ]},
 {t:"ส่งงาน",v:[
  {n:"A",d:"เมฆรูปเห็ด",ms:1500,m:"ส่งแล้ว!",s:"+20 XP",f(g,W,H,t){const cx=Math.floor(W*.5),gr=H-3;if(t<.07){g.globalAlpha=.55*(1-t/.07);rect(g,0,0,W,H,HI);g.globalAlpha=1}const p=out(clamp((t-.05)/.45)),top=gr-p*H*.62,r=3+p*Math.min(H*.3,W*.2),tick=Math.floor(t*12);for(let y=Math.floor(top);y<gr;y++){const hw=2+Math.floor(hash(y,tick)*2)+(gr-y<5?5-(gr-y):0);for(let x=-hw;x<=hw;x++)px(g,cx+x,y,hash(x,y)>.82?DIM:ON)}const cap=(x,y)=>{const n=hash(x,y+tick);if(n<.1)return;const rel=(y-top)/r;px(g,x,y,rel>.25&&n<.35?DIM:rel<-.5?HI:ON)};disc(g,cx-r*.62,top,r*.68,cap);disc(g,cx+r*.62,top,r*.68,cap);disc(g,cx,top-r*.4,r*.78,cap);const dw=p*W*.44;for(let x=-dw;x<=dw;x++)px(g,cx+x,gr,ON);if(t<.75){const q=clamp(t/.75);for(let a=0;a<70;a++){const an=a/70*3.1416;px(g,cx+Math.cos(an)*q*W*.62,gr-Math.sin(an)*q*5,HI)}}}},
  {n:"B",d:"จรวดงานขึ้นฟ้า",ms:1300,m:"ปล่อยแล้ว บุญรักษา",s:"+20 XP",f(g,W,H,t){for(let i=0;i<30;i++){const x=hash(i,1)*W,y=((hash(i,2)+t*(t>.2?1.6:0))%1)*H;rect(g,x,y,1,t>.2?4:1,DIM)}const p=clamp((t-.2)/.7),y=H-14-(p*p)*(H+18),x=W/2-7+(t<.2?(hash(1,Math.floor(t*40))-.5)*2:0);sp(g,PAPER,x,y,2,ON);line(g,x,y+14,x-6,y+22,ON,2);line(g,x+13,y+14,x+19,y+22,ON,2);for(let i=0;i<10;i++)rect(g,x+3+hash(i,Math.floor(t*30))*8,y+15+hash(i+3,Math.floor(t*30))*12,2,2,i%2?HI:ON)}},
  {n:"C",d:"ไหว้ขอคะแนน",ms:1500,m:"ขอให้อาจารย์เมตตา",s:"+20 XP",f(g,W,H,t){ground(g,W,H);const cx=W/2;sp(g,PAPER,cx+14,H-3-16,2,ON);rect(g,cx+6,H-9,4,6,DIM);for(let s=0;s<3;s++){const sx=cx+5+s*3;rect(g,sx,H-15,1,6,ON);const n=Math.floor(clamp(t/.5)*16);for(let k=0;k<n;k++)if(hash(k,s+Math.floor(t*8))>.25)px(g,sx+Math.sin(k*.5+t*9+s)*2,H-16-k*2,k>9?DIM:ON)}sp(g,Math.sin(t*14)>0?BOW:STAND,cx-32,H-3-MAN_H)}}
 ]}
];

ACT[0].v.push(
 {n:"D",d:"กาแฟแก้วที่สาม",ms:1300,m:"ตาค้างแต่มา",s:"+5 XP",f(g,W,H,t){const cx=W/2-12,y=H-22;frame(g,cx,y,22,20,ON);rect(g,cx+22,y+5,6,1,ON);rect(g,cx+22,y+13,6,1,ON);rect(g,cx+27,y+5,1,9,ON);const fill=18*out(clamp(t/.5));rect(g,cx+1,y+19-fill,20,fill,DIM);if(t>.3)for(let s=0;s<3;s++)for(let k=0;k<10;k++)px(g,cx+5+s*6+Math.sin(k*.7+t*14+s)*2,y-2-k*2*clamp((t-.3)/.4),k>6?DIM:ON)}},

);
ACT[1].v.push(
 {n:"D",d:"ฝนตก (ที่บ้านแดดออก)",ms:1400,m:"ฝนตกเลยไม่ไป",s:"ขาดได้อีก 2",f(g,W,H,t){ground(g,W,H);const cx=W/2;for(let i=0;i<46;i++){const x=hash(i,6)*W,y=((hash(i,7)+t*2.4)%1)*(H-4);if(Math.abs(x-cx)<15&&y>H-40)continue;rect(g,x,y,1,3,DIM)}disc(g,cx,H-26,15,(x,y)=>{if(y<=H-26)px(g,x,y,ON)});rect(g,cx,H-26,1,6,ON);sp(g,STAND,cx-7,H-23)}},
