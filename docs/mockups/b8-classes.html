<html lang="th">
<head>
<meta charset="utf-8">

<title>คลาสและสายย่อย</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600&family=Chonburi&display=swap" rel="stylesheet">
<style>
:root{--cave:#0F0D0C;--panel:#1B1613;--seam:#3B3027;--bone:#E8DFCB;--ash:#B5A88F;--gold:#C9A25B}
*{box-sizing:border-box}
html,body{background:var(--cave)}
body{margin:0;color:var(--bone);font:400 16px/1.55 Anuphan,sans-serif}
::selection{background:var(--gold);color:var(--cave)}
.top{max-width:1040px;margin:0 auto;padding:28px 16px 6px}
h1{font:400 30px/1.4 Chonburi,serif;margin:0 0 4px;color:var(--gold)}
.top p{margin:0;color:var(--ash);max-width:62ch}
.mode{display:flex;gap:8px;margin:14px 0 4px;flex-wrap:wrap}
.mode button{min-height:44px;padding:0 16px;background:transparent;color:var(--ash);border:1px solid var(--seam);border-radius:3px;font:500 16px/1 Anuphan,sans-serif;cursor:pointer}
.mode button[aria-pressed=true]{color:var(--cave);background:var(--gold);border-color:var(--gold)}
.mode button:focus-visible{outline:2px solid var(--bone);outline-offset:2px}
main{max-width:1040px;margin:0 auto;padding:12px 16px 56px}
.cls{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);border-top:1px solid var(--seam);padding:22px 0}
.base{padding-right:24px}
.base h2{font:400 25px/1.4 Chonburi,serif;margin:0;color:var(--gold)}
.vibe{color:var(--ash);margin:0 0 8px}
canvas{display:block;image-rendering:pixelated}
.big{width:192px;height:192px}
.small{width:128px;height:128px;flex:none}
.trait{margin:8px 0 0;font-size:15px}
.side{min-width:0}
.after{font-weight:500;color:var(--ash);margin:0 0 10px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.asc{background:var(--panel);border:1px solid var(--seam);border-radius:3px;padding:12px;display:flex;gap:12px;min-width:0}
.asc h3{font:400 19px/1.45 Chonburi,serif;margin:0 0 4px}
.asc p{margin:0;font-size:15px;line-height:1.5;color:var(--ash)}
.foot{border-top:1px solid var(--seam);padding-top:16px;color:var(--ash);font-size:15px}
@media (max-width:820px){.cls{grid-template-columns:1fr}.base{padding:0 0 16px}}
@media (max-width:620px){.pair{grid-template-columns:1fr}}
</style>
</head>

</div>
