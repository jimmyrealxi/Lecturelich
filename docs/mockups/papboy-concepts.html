<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pap-Boy คอนเซปต์ตัวละคร</title>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#2A2E2B;font:15px/1.5 "IBM Plex Sans Thai",sans-serif;color:#E4E6E2;padding:28px 16px}
h1{font:700 22px/1.3 "Chakra Petch",sans-serif;color:#fff;margin-bottom:6px}
p.note{color:#B9BFBA;font-size:14px;max-width:820px;margin-bottom:24px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:24px;max-width:1100px}
.card{background:#1E2320;border:1px solid #3A433C;padding:16px}
.card h2{font:700 18px "Chakra Petch",sans-serif;color:#F2C230}
.card .tag{font-size:13px;color:#A2ADA4;margin-bottom:12px}
.pair{display:flex;gap:10px;margin-bottom:12px}
.pair figure{flex:1;padding:12px 8px 8px;text-align:center}
.pair .dark{background:#1E3D74}.pair .light{background:#E6E9EE}
canvas{width:110px;height:100px;image-rendering:pixelated;display:block;margin:0 auto}
figcaption{font:500 12px "Chakra Petch";margin-top:6px}
.dark figcaption{color:#C2CDE0}.light figcaption{color:#4A5873}
.faces{display:flex;gap:8px;margin-bottom:12px}
.faces figure{background:#1E3D74;padding:8px;text-align:center;flex:1}
.faces canvas{width:66px;height:60px}
ul{padding-left:18px;color:#C9CEC9;font-size:14px}
.pick{display:inline-block;margin-top:10px;font:600 13px "Chakra Petch";background:#F2C230;color:#14213A;padding:3px 10px}
</style>
</head>
<body>
<h1>Pap-Boy — คอนเซปต์ตัวละคร (เลือก 1)</h1>
<p class="note">
  ไม่ใช้รูปคนธรรมดา (จะได้ไม่ไปคล้ายมาสคอตเกมไหน) · ทุกตัวมี <b>ท่าประจำตัวแบห้านิ้ว</b> ใส่ถุงมือขาว ·
  ดูบนพื้นน้ำเงิน (แผงคาบ) และพื้นเทา (หน้ารายการ) ให้เห็นว่าเด่นทั้งสองแบบ · ท่าว่างขยับขึ้นลงเบา ๆ ·
  ภาพจริงในแอปเป็น PNG พิกเซลแผ่นเดียว
</p>
<div class="grid" id="grid"></div>

<script>
const PAL={K:"#14213A",Y:"#F2C230",y:"#FFE680",D:"#0E1A2E",W:"#E8ECF2",w:"#AEB6C4",O:"#E07A3F",o:"#B85A26",
  R:"#C2372C",r:"#8F2620",b:"#F3F5F8",P:"#2E3A55",g:"#8C97AA",G:"#9FE0B0"};
const CONCEPTS=[
 {key:"A",name:"A · หัวจอ",tag:"หัวเป็นจอ CRT หน้าตาเป็นพิกเซลเรืองแสงบนจอ เสื้อฮู้ดส้ม · เข้าธีมเทอร์มินัลที่สุด",
  why:["หน้าบนจอเปลี่ยนได้ไม่จำกัด (ยิ้ม ง่วง ตกใจ ตัวเลข XP) โดยไม่ต้องวาดตัวใหม่","สีส้มตัดกับน้ำเงิน/เทา เห็นชัดทั้งสองพื้น","เสาอากาศกะพริบตอนได้ XP"],
  rows:[
"         Y","         K",
"   WWWWWWWWWWWWW",
"   WDDDDDDDDDDDw",
"   WDDDDDDDDDDDw",
"   WDDGDDDDDGDDw",
"   WDDGDDDDDGDDw",
"   WDDDDDDDDDDDw",
"   WDDGDDDDDGDDw",
"   WDDDGGGGGDDDw",
"   WDDDDDDDDDDDw",
"   wwwwwwwwwwwww",
"       KKKKK",
"     OOOOYOOOO",
"    WOOOOYOOOOW",
"    WOOOOYOOOOW",
"     oooooooooo",
"     PPP   PPP",
"     KKK   KKK"],
  legStart:17, rest:{col:14,rows:[14,15]}, palmAt:[15,6], sleeve:"O",
  faces:{ "ยิ้ม":null,
    "ง่วง":["   WDDDDDDDDDDDw","   WDDDDDDDDDDDw","   WDDGGDDDGGDDw","   WDDDDDDDDDDDw","   WDDDDDDDDDDDw","   WDDDDGGGDDDDw"],
    "ตกใจ":["   WDDDDDDDDDDDw","   WDDGGDDDGGDDw","   WDDGGDDDGGDDw","   WDDDDDDDDDDDw","   WDDDDDGGDDDDw","   WDDDDDGGDDDDw"],
    "+XP":["   WDDDDDDDDDDDw","   WDGDDDDDDDDDw","   WGGGDGDGDGGDw","   WDGDDDGDDGDGw","   WDDDDGDGDGGDw","   WDDDDDDDDGDDw"]},
  faceRows:[3,4,5,6,7,8,9,10].slice(1,7)},
 {key:"B",name:"B · สมุดมีขา",tag:"ตัวเป็นสมุดปกแดงห่วงสันขาว ที่คั่นหนังสือสีเหลืองเป็นเหมือนเสาอากาศ",
  why:["ตรงกับแอปจดเรียนที่สุด","เปิดปกได้ = ท่าจดโน้ต","หน้าแบนกว่า A แสดงอารมณ์ได้น้อยกว่า"],
  rows:[
"       YY",
"   RRRRYRRRRRRRK",
"  bRRRRYRRRRRRRK",
"  KRRRRRRRRRRRRK",
"  bRRbbRRRRbbRRK",
"  KRRbKRRRRbKRRK",
"  bRRRRRRRRRRRRK",
" WKRRRRYYYYRRRRKW",
" WbRRRRRRRRRRRRKW",
"  KRRRRRRRRRRRRK",
"  brrrrrrrrrrrrK",
"   KKKKKKKKKKKKK",
"    bbbbbbbbbbbb",
"     KK    KK",
"     KK    KK",
"    KKK   KKK"],
  legStart:13, rest:{col:16,rows:[7,8]}, palmAt:[17,2], sleeve:"r"},
 {key:"C",name:"C · หัวหลอดไฟ",tag:"หัวเป็นหลอดไฟสีเหลือง = \"ไอเดียมาแล้ว\" ขั้วเกลียวเป็นคอ เสื้อเทา",
  why:["ความหมายดี (เข้าใจแล้ว/คิดออก)","หัวเรืองได้ตอนทำงานเสร็จ","เหลืองเยอะ ต้องระวังบนพื้นอ่อน"],
  rows:[
"      yYYYYY",
"    yyYYYYYYYY",
"   yYYYYYYYYYYY",
"  YYYYYKYYYYKYYY",
"  YYYYYKYYYYKYYY",
"  YYYYYYYYYYYYYY",
"  YYYYYKYYYYKYYY",
"   YYYYYKKKKYYY",
"    YYYYYYYYYY",
"     wWwWwWwW",
"     WwWwWwWw",
"      KKKKKK",
"     gggggggg",
"    WggggggggW",
"    WggggggggW",
"     gggggggg",
"     PPP  PPP",
"     KKK  KKK"],
  legStart:16, rest:{col:13,rows:[13,14]}, palmAt:[14,6], sleeve:"g"},
];
const PALM=["WwWwW","WwWwW","WWWWW"," WWW ","  X  ","  X  ","  X  "];
const W=22,H=20;
function paint(cv,rows,{bob=0,legStart=99,palm=null,rest=null,sleeve="K"}={}){
  const c=cv.getContext("2d");c.clearRect(0,0,W,H);
  rows.forEach((r,y)=>[...r].forEach((ch,x)=>{
    if(!PAL[ch])return;
    if(palm&&rest&&x===rest.col&&rest.rows.includes(y))return; // ท่าแบมือ = เอามือที่ห้อยออก
    c.fillStyle=PAL[ch];c.fillRect(x,y+(y<legStart?bob:0)+1,1,1);
  }));
  if(palm){PALM.forEach((r,y)=>[...r].forEach((ch,x)=>{const k=ch==="X"?sleeve:ch;if(PAL[k]){c.fillStyle=PAL[k];c.fillRect(palm[0]+x,palm[1]+y+bob,1,1)}}))}
}
const grid=document.getElementById("grid");const live=[];
CONCEPTS.forEach(cn=>{
  const card=document.createElement("section");card.className="card";
  card.innerHTML=`<h2>${cn.name}</h2><div class="tag">${cn.tag}</div>
   <div class="pair">
     <figure class="dark"><canvas width="${W}" height="${H}"></canvas><figcaption>ว่าง (บนแผงน้ำเงิน)</figcaption></figure>
     <figure class="light"><canvas width="${W}" height="${H}"></canvas><figcaption>แบห้านิ้ว (บนพื้นเทา)</figcaption></figure>
   </div>${cn.faces?'<div class="faces"></div>':""}
   <ul>${cn.why.map(w=>`<li>${w}</li>`).join("")}</ul>${cn.key==="A"?'<span class="pick">แนะนำ</span>':""}`;
  grid.append(card);
  const [idle,palm]=card.querySelectorAll(".pair canvas");
  live.push(f=>{paint(idle,cn.rows,{bob:f,legStart:cn.legStart});paint(palm,cn.rows,{bob:f,legStart:cn.legStart,palm:cn.palmAt,rest:cn.rest,sleeve:cn.sleeve})});
  if(cn.faces){const box=card.querySelector(".faces");
    for(const [label,face] of Object.entries(cn.faces)){
      const fig=document.createElement("figure");const cv=document.createElement("canvas");cv.width=W;cv.height=H;
      fig.append(cv);const cap=document.createElement("figcaption");cap.textContent=label;cap.style.color="#C2CDE0";fig.append(cap);box.append(fig);
      const rows=cn.rows.slice();if(face)face.forEach((r,i)=>rows[4+i]=r);
      paint(cv,rows,{legStart:cn.legStart});
    }}
});
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;let f=0;
live.forEach(d=>d(0));
if(!reduce)setInterval(()=>{f=1-f;live.forEach(d=>d(f))},450);
</script>
</body>
</html>
